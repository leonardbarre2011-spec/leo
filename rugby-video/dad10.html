<script type="module">

// ---------- utilities ----------

const vl = (a,b,t)=>a.clone().lerp(b,t);

const M = (c, o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.75, metalness:0}, o));

// ---------- faces ----------
const faceCache = {};
function faceTex(type){
  if(faceCache[type]) return faceCache[type];
  const t = ctex(320,256,(g,w,h)=>{
    g.clearRect(0,0,w,h);

    const brows=(inner,outer)=>{g.lineWidth=10;g.beginPath();g.moveTo(ex[0]-24,ey-38+outer);g.lineTo(ex[0]+20,ey-38+inner);g.moveTo(ex[1]+24,ey-38+outer);g.lineTo(ex[1]-20,ey-38+inner);g.stroke();g.lineWidth=12;};

      case 'joy': g.lineWidth=11; ex.forEach(x=>{g.beginPath();g.arc(x,ey+8,20,1.1*Math.PI,1.9*Math.PI);g.stroke();});

      case 'shock': ex.forEach(x=>{g.fillStyle='#fff';g.beginPath();g.arc(x,ey,24,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(x,ey,11,0,7);g.fill();});
        g.beginPath(); g.ellipse(160,185,20,26,0,0,7); g.fill(); break;
      case 'mean': eyes(12,14); brows(18,-6); g.beginPath(); g.moveTo(115,165); g.quadraticCurveTo(170,200,215,150); g.stroke();
        g.beginPath(); g.moveTo(125,168); g.quadraticCurveTo(170,215,210,158); g.closePath(); g.fill(); break;
      case 'old': eyes(10,16);
        g.lineWidth=7; ex.forEach(x=>{g.beginPath();g.arc(x,ey,30,0,7);g.stroke();}); g.beginPath();g.moveTo(140,ey);g.lineTo(180,ey);g.stroke();
        g.fillStyle='#ddd'; g.beginPath(); g.ellipse(160,158,52,14,0,0,7); g.fill(); g.fillStyle='#111';
        g.lineWidth=10; g.beginPath(); g.arc(160,165,34,0.2*Math.PI,0.8*Math.PI); g.stroke(); break;
      case 'oldsad': eyes(10,16);
        g.lineWidth=7; ex.forEach(x=>{g.beginPath();g.arc(x,ey,30,0,7);g.stroke();}); g.beginPath();g.moveTo(140,ey);g.lineTo(180,ey);g.stroke();
        g.fillStyle='#ddd'; g.beginPath(); g.ellipse(160,158,52,14,0,0,7); g.fill(); g.fillStyle='#111';
        g.lineWidth=9; g.beginPath(); g.arc(160,175,20,0.15*Math.PI,0.85*Math.PI); g.stroke(); break;

      case 'tired': g.lineWidth=9; ex.forEach(x=>{g.beginPath();g.ellipse(x,ey+4,13,9,0,0,Math.PI*2);g.fill();g.beginPath();g.moveTo(x-18,ey-6);g.lineTo(x+18,ey-6);g.stroke();});
        g.strokeStyle='rgba(120,90,110,.45)'; g.lineWidth=6; ex.forEach(x=>{g.beginPath();g.arc(x,ey+18,16,0.15*Math.PI,0.85*Math.PI);g.stroke();}); g.strokeStyle='#111';
        g.lineWidth=9; g.beginPath(); g.moveTo(140,180); g.lineTo(180,180); g.stroke(); break;
      case 'tiredsmile': g.lineWidth=9; ex.forEach(x=>{g.beginPath();g.ellipse(x,ey+4,13,10,0,0,Math.PI*2);g.fill();g.beginPath();g.moveTo(x-18,ey-6);g.lineTo(x+18,ey-6);g.stroke();});
        g.strokeStyle='rgba(120,90,110,.45)'; g.lineWidth=6; ex.forEach(x=>{g.beginPath();g.arc(x,ey+18,16,0.15*Math.PI,0.85*Math.PI);g.stroke();}); g.strokeStyle='#111';
        g.lineWidth=10; g.beginPath(); g.arc(160,150,34,0.2*Math.PI,0.8*Math.PI); g.stroke(); break;
      case 'happycrydad': g.lineWidth=11; ex.forEach(x=>{g.beginPath();g.arc(x,ey+8,20,1.1*Math.PI,1.9*Math.PI);g.stroke();}); tears();
        g.strokeStyle='rgba(120,90,110,.45)'; g.lineWidth=6; ex.forEach(x=>{g.beginPath();g.arc(x,ey+24,16,0.15*Math.PI,0.85*Math.PI);g.stroke();}); g.strokeStyle='#111';
        g.lineWidth=12; g.beginPath(); g.arc(160,150,44,0.15*Math.PI,0.85*Math.PI); g.stroke(); break;
      case 'pain': g.lineWidth=11; ex.forEach((x,i)=>{const d=i?-1:1; g.beginPath(); g.moveTo(x-18*d,ey-14); g.lineTo(x+14*d,ey); g.lineTo(x-18*d,ey+14); g.stroke();});
        g.fillStyle='#fff'; g.fillRect(118,160,84,30); g.strokeRect(118,160,84,30); g.lineWidth=5; g.beginPath(); g.moveTo(118,175); g.lineTo(202,175); g.stroke(); g.fillStyle='#111'; break;
      case 'dad': eyes(); g.lineWidth=10; g.beginPath(); g.moveTo(ex[0]-22,ey-40); g.lineTo(ex[0]+18,ey-42); g.moveTo(ex[1]+22,ey-40); g.lineTo(ex[1]-18,ey-42); g.stroke();

        g.lineWidth=12; g.beginPath(); g.arc(160,148,44,0.15*Math.PI,0.85*Math.PI); g.stroke(); break;
      case 'down': eyes(12,8); brows(-10,8); g.beginPath(); g.arc(160,215,36,1.25*Math.PI,1.75*Math.PI); g.stroke(); break;
    }
  });
  return faceCache[type]=t;
}
function jerseyTex(color, number, name, hoop){
  return ctex(256,256,(g,w,h)=>{
    g.fillStyle=color; g.fillRect(0,0,w,h);
    if(hoop){ g.fillStyle=hoop; g.fillRect(0,40,w,28); g.fillRect(0,130,w,28); }
    if(number!==undefined){
      g.fillStyle='#fff'; g.font='900 150px Inter'; g.textAlign='center'; g.textBaseline='middle';
      g.lineWidth=10; g.strokeStyle='rgba(0,0,0,.35)'; g.strokeText(number,128,150); g.fillText(number,128,150);
      if(name){ g.font='900 40px Inter'; g.fillText(name,128,40); }
    }
  });
}

// ---------- avatar ----------
const geoBox = new THREE.BoxGeometry(1,1,1);
function part(w,h,d,mat,y){ const m=new THREE.Mesh(geoBox,mat); m.scale.set(w,h,d); m.position.y=y; m.castShadow=true; m.receiveShadow=true; return m; }
const avatars=[];
function makeAvatar(o){
  const skin=M(o.skin||'#f5c9a0'), shirt=M(o.shirt), shorts=M(o.shorts||'#ffffff'), socks=M(o.socks||o.shirt), boots=M('#111');
  const root=new THREE.Group(); const body=new THREE.Group(); root.add(body);
  // legs
  const legs=[-0.5,0.5].map(x=>{ const p=new THREE.Group(); p.position.set(x,2,0);
    p.add(part(.98,.8,1,shorts,-.4)); p.add(part(.96,.55,.96,skin,-1.07));
    if(o.trousers){ p.children[1].material=shorts; }
    p.add(part(.98,.5,.98,socks,-1.6)); p.add(part(1,.2,1.15,boots,-1.9));
    body.add(p); return p; });
  // torso
  const front = o.frontTex ? new THREE.MeshStandardMaterial({map:o.frontTex,roughness:.8}) : shirt;
  const back = o.backTex ? new THREE.MeshStandardMaterial({map:o.backTex,roughness:.8}) : shirt;
  const torso=new THREE.Mesh(geoBox,[shirt,shirt,shirt,shirt,front,back]); torso.scale.set(2,2,1); torso.position.y=3; torso.castShadow=true;
  const torsoG=new THREE.Group(); torsoG.position.y=2; torso.position.y=1; torsoG.add(torso); body.add(torsoG);
  const arms=[-1.5,1.5].map(x=>{ const p=new THREE.Group(); p.position.set(x,1.8,0);
    p.add(part(.98,.75,.98,shirt,-.2)); p.add(part(.96,1.25,.96,o.longSleeve?shirt:skin,-1.2)); p.children[1].position.y=-1.15;
    if(o.longSleeve){ const hnd=part(.97,.3,.97,skin,-1.65); p.add(hnd); }
    torsoG.add(p); return p; });
  // head
  const head=new THREE.Group(); head.position.y=2; torsoG.add(head);
  const hm=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,1.2,32), skin); hm.position.y=.62; hm.castShadow=true; head.add(hm);
  const faceMat=new THREE.MeshBasicMaterial({map:faceTex(o.face||'smile'), transparent:true, depthWrite:false});
  const fm=new THREE.Mesh(new THREE.CylinderGeometry(.625,.625,1.0,32,1,true,-1.05,2.1), faceMat); fm.position.y=.62; head.add(fm);
  if(o.hair){ const hmat=M(o.hair);
    const top=new THREE.Mesh(new THREE.CylinderGeometry(.66,.66,.35,32),hmat); top.position.y=1.28; top.castShadow=true; head.add(top);
    const bk=new THREE.Mesh(new THREE.CylinderGeometry(.66,.66,.7,32,1,false,Math.PI*0.55,Math.PI*0.9),hmat); bk.position.y=1.0; head.add(bk);
    if(o.bald){ top.visible=false; bk.position.y=.85; bk.scale.y=.6; }
  }
  root.scale.setScalar(o.scale||1);
  const av={root,body,torso:torsoG,head,lLeg:legs[0],rLeg:legs[1],lArm:arms[0],rArm:arms[1],faceMat,
    setFace(f){ this.faceMat.map=faceTex(f); },
    reset(){ for(const p of [this.lLeg,this.rLeg,this.lArm,this.rArm,this.head,this.torso]) p.rotation.set(0,0,0); this.body.position.set(0,0,0); this.body.rotation.set(0,0,0); this.root.visible=true; }};
  avatars.push(av); return av;
}
function poseRun(av, ph, amp=1){ const s=Math.sin(ph);
  av.lLeg.rotation.x= s*0.9*amp; av.rLeg.rotation.x=-s*0.9*amp;
  av.lArm.rotation.x=-s*0.9*amp; av.rArm.rotation.x= s*0.9*amp;
  av.torso.rotation.x=0.18*amp; av.body.position.y=Math.abs(Math.cos(ph))*0.35*amp; }
function poseWalk(av, ph, amp=1){ const s=Math.sin(ph);
  av.lLeg.rotation.x= s*0.5*amp; av.rLeg.rotation.x=-s*0.5*amp; av.lArm.rotation.x=-s*0.4*amp; av.rArm.rotation.x=s*0.4*amp; av.body.position.y=Math.abs(Math.cos(ph))*0.1; }
function poseBreath(av,t){ av.torso.rotation.x=Math.sin(t*2)*0.02; av.lArm.rotation.z=-0.06-Math.sin(t*2)*0.02; av.rArm.rotation.z=0.06+Math.sin(t*2)*0.02; }
function place(av,p,ry){ av.root.position.copy(p); av.root.rotation.y=ry; }
function faceDir(from,to){ return Math.atan2(to.x-from.x, to.z-from.z); }

// ---------- ball ----------
const ballTex = ctex(256,128,(g,w,h)=>{ g.fillStyle='#f4efe4'; g.fillRect(0,0,w,h); g.fillStyle='#1d4ed8'; g.fillRect(0,46,w,36);
  g.fillStyle='#c81e1e'; g.fillRect(0,40,w,6); g.fillRect(0,82,w,6); g.strokeStyle='#999'; g.lineWidth=3; for(let i=0;i<4;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.stroke();} });
function makeBall(){ const m=new THREE.Mesh(new THREE.SphereGeometry(1,32,20), new THREE.MeshStandardMaterial({map:ballTex,roughness:.6}));
  m.scale.set(.55,.55,.9); m.castShadow=true; const g=new THREE.Group(); m.rotation.x=0; g.add(m); g.userData.m=m; scene.add(g); return g; }
const ball = makeBall();

// ---------- world groups ----------
const G = {stadium:new THREE.Group(), garden:new THREE.Group(), school:new THREE.Group(), cemetery:new THREE.Group()};
Object.values(G).forEach(g=>scene.add(g));

// ===== STADIUM =====
const grassTex = ctex(512,512,(g,w,h)=>{ for(let i=0;i<8;i++){ g.fillStyle=i%2?'#2f7d32':'#38903a'; g.fillRect(0,i*64,w,64);}
  for(let i=0;i<3000;i++){ g.fillStyle=`rgba(${rnd()*40|0},${80+rnd()*60|0},20,.25)`; g.fillRect(rnd()*w,rnd()*h,2,4);} });
grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping; grassTex.repeat.set(4,4);
const field=new THREE.Mesh(new THREE.PlaneGeometry(420,420), new THREE.MeshStandardMaterial({map:grassTex,roughness:.95}));
field.rotation.x=-Math.PI/2; field.position.set(0,0,60); field.receiveShadow=true; G.stadium.add(field);
const lineM=M('#ffffff',{roughness:.6});
const line=(x,z,w,d)=>{ const m=box(w,.06,d,lineM,false); m.position.set(x,.03,z); G.stadium.add(m); };
line(0,0,190,.5); line(0,62,190,.5); line(0,-28,190,.5); line(95,60,.5,200); line(-95,60,.5,200);
for(let x=-90;x<=90;x+=6) line(x,15,2.4,.4);
// posts
const postM=M('#ffffff',{roughness:.35});
const padM=M('#1d4ed8');
[-8,8].forEach(x=>{ const p=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,34,16),postM); p.position.set(x,17,0); p.castShadow=true; G.stadium.add(p);
  const pad=box(1.8,5,1.8,padM); pad.position.set(x,2.5,0); G.stadium.add(pad); });
const bar=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,16,16),postM); bar.rotation.z=Math.PI/2; bar.position.set(0,8,0); bar.castShadow=true; G.stadium.add(bar);
// tee
const tee=new THREE.Mesh(new THREE.CylinderGeometry(.15,.45,.5,12), M('#ff8a00'));
const T=V(40,0,60); tee.position.set(T.x,.25,T.z); G.stadium.add(tee);
// stands + crowd
const standM=M('#2a2f3a',{roughness:.9}); const standM2=M('#3a4150',{roughness:.9});
const crowdSpots=[]; // {pos, ry}
function stand(kind){
  for(let r=0;r<13;r++){
    const top=1.5+r*2.0, off=r*3.2;
    let m;
    if(kind==='back'){ m=box(230,top,3.2,r%2?standM:standM2,false); m.position.set(0,top/2,-40-off-1.6); }
    else { const sx=kind==='right'?1:-1; m=box(3.2,top,190,r%2?standM:standM2,false); m.position.set(sx*(108+off+1.6),top/2,55); }

function chunksOf(line) {
  if (line._ch) return line._ch;
  const words = line.text.split(' '); const out = []; let cur = [];
  words.forEach((w, i) => { cur.push(w); if (cur.length >= 5 || (/[.,!?]$/.test(w) && cur.length >= 2 && i < words.length - 1 && words.length - i > 2)) { out.push(cur); cur = []; } });
  if (cur.length) out.push(cur);
  const total = line.text.length; let acc = 0;
  line._ch = out.map(c => { const s = acc / total; const lens = c.map(w => w.length + 1); acc += lens.reduce((a, b) => a + b, 0); return { words: c, lens, s, e: Math.min(1, acc / total) }; });
  return line._ch;
}
