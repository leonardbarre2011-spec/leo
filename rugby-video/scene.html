<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>La dernière transformation</title>
<style>

  #stage{position:relative;width:720px;height:1280px;overflow:hidden;background:#000}
  canvas{position:absolute;inset:0;width:720px;height:1280px;display:block}
  .ov{position:absolute;inset:0;pointer-events:none}
  #vignette{background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.85) 100%);opacity:.5}
  #tint{mix-blend-mode:multiply;opacity:0}
  #flash{background:#fff;opacity:0}
  #black{background:#000;opacity:0}
  .bar{position:absolute;left:0;right:0;height:0;background:#000}
  #barT{top:0} #barB{bottom:0}
  #grain{opacity:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
  #caption{position:absolute;left:40px;right:40px;top:230px;text-align:center;
    font-family:'Inter';font-weight:900;font-size:62px;line-height:1.08;color:#fff;
    -webkit-text-stroke:12px #000;paint-order:stroke fill;letter-spacing:-.5px;
    transform-origin:50% 50%;opacity:0}
  #caption.red{color:#ff4d4d;font-size:54px}
  #caption.gold{color:#ffd23f;font-size:84px}
  #caption.huge{font-size:120px}
  #caption.soft{font-weight:800;font-size:54px}
  #score{position:absolute;top:70px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;
    font-family:'Inter';font-weight:900;color:#fff;font-size:34px;border-radius:12px;overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.5);opacity:0}
  #score .t{padding:10px 18px;display:flex;align-items:center;gap:10px}
  #score .b{background:#1d4ed8} #score .r{background:#c81e1e}
  #score .n{background:#111;padding:10px 16px;min-width:46px;text-align:center}
  #score .clk{background:#000;color:#ff3b3b;padding:10px 14px;font-size:28px;display:flex;align-items:center}
  #fbtag{position:absolute;top:150px;left:50%;transform:translateX(-50%);font-family:'Inter';font-weight:700;
    letter-spacing:10px;color:rgba(255,240,210,.85);font-size:24px;opacity:0}
  #end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    background:rgba(0,0,0,.72);opacity:0;font-family:'Inter';color:#fff;text-align:center}
  #end .a{font-weight:900;font-size:60px;-webkit-text-stroke:10px #000;paint-order:stroke fill}
  #end .btn{background:#ff2d55;font-weight:900;font-size:46px;padding:22px 46px;border-radius:999px}
  #end .q{font-weight:800;font-size:44px;color:#ffd23f;padding:0 40px}
  svg.heart{display:inline-block;width:62px;height:62px;vertical-align:-8px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="720" height="1280"></canvas>
  <div class="ov" id="tint"></div>
  <div class="ov" id="grain"></div>
  <div class="ov" id="vignette"></div>
  <div class="bar" id="barT"></div><div class="bar" id="barB"></div>
  <div id="score"><div class="t b">BLEUS</div><div class="n" id="sb">19</div><div class="n" id="sr">20</div><div class="t r">ROUGES</div><div class="clk" id="clk">80:00</div></div>
  <div id="fbtag">SOUVENIR</div>
  <div id="caption"></div>
  <div class="ov" id="flash"></div>
  <div class="ov" id="black"></div>
  <div id="end"><div class="a">Tu aurais tenu<br>la pression ?</div><div class="q">Dis-le en commentaire</div><div class="btn">ABONNE-TOI</div></div>
</div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ---------- utilities ----------
let seed = 12345;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp = (a,b,t)=>a+(b-a)*t;
const ease = t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eOut = t=>1-Math.pow(1-t,3);
const V = (x,y,z)=>new THREE.Vector3(x,y,z);
const vl = (a,b,t)=>a.clone().lerp(b,t);
const seg = (u,a,b)=>clamp((u-a)/(b-a));

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(window.PR || 1.5);
renderer.setSize(720,1280,false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 720/1280, 0.1, 2000);

const hemi = new THREE.HemisphereLight(0xbcd4ff, 0x203018, 0.6); scene.add(hemi);
const amb = new THREE.AmbientLight(0xffffff, 0.15); scene.add(amb);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera; sc.left=-45; sc.right=45; sc.top=45; sc.bottom=-45; sc.near=1; sc.far=400;
sun.shadow.bias = -0.0005;
scene.add(sun); scene.add(sun.target);
const fill=new THREE.PointLight(0xfff0dd,0,0,0); camera.add(fill); fill.position.set(0,2,0); scene.add(camera);

const M = (c, o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.75, metalness:0}, o));
function box(w,h,d,mat,cast=true){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.castShadow=cast; m.receiveShadow=true; return m; }
function ctex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t; }

// ---------- faces ----------
const faceCache = {};
function faceTex(type){
  if(faceCache[type]) return faceCache[type];
  const t = ctex(320,256,(g,w,h)=>{
    g.clearRect(0,0,w,h);
    g.fillStyle='#111'; g.strokeStyle='#111'; g.lineCap='round'; g.lineWidth=12;
    const ex=[110,210], ey=105;
    const eyes=(rx=13,ry=22)=>ex.forEach(x=>{g.beginPath();g.ellipse(x,ey,rx,ry,0,0,Math.PI*2);g.fill(); g.fillStyle='#fff';g.beginPath();g.arc(x+4,ey-8,5,0,7);g.fill();g.fillStyle='#111';});
    const brows=(inner,outer)=>{g.lineWidth=10;g.beginPath();g.moveTo(ex[0]-24,ey-38+outer);g.lineTo(ex[0]+20,ey-38+inner);g.moveTo(ex[1]+24,ey-38+outer);g.lineTo(ex[1]-20,ey-38+inner);g.stroke();g.lineWidth=12;};
    const tears=()=>{g.fillStyle='rgba(80,170,255,.95)';ex.forEach(x=>{g.beginPath();g.moveTo(x-6,ey+18);g.quadraticCurveTo(x-16,ey+80,x-4,ey+120);g.quadraticCurveTo(x+10,ey+80,x+6,ey+18);g.fill();});g.fillStyle='#111';};
    switch(type){
      case 'smile': eyes(); g.beginPath(); g.arc(160,150,48,0.15*Math.PI,0.85*Math.PI); g.stroke(); break;
      case 'determined': eyes(12,17); brows(14,-4); g.beginPath(); g.moveTo(130,180); g.lineTo(190,176); g.stroke(); break;
      case 'nervous': eyes(12,20); brows(-8,4); g.beginPath(); g.moveTo(128,182); g.quadraticCurveTo(145,172,160,182); g.quadraticCurveTo(175,192,192,180); g.stroke(); break;
      case 'sad': eyes(); brows(-12,6); g.beginPath(); g.arc(160,215,40,1.2*Math.PI,1.8*Math.PI); g.stroke(); break;
      case 'cry': eyes(); brows(-12,6); tears(); g.beginPath(); g.arc(160,218,40,1.2*Math.PI,1.8*Math.PI); g.stroke(); break;
      case 'happycry': g.lineWidth=11; ex.forEach(x=>{g.beginPath();g.arc(x,ey+8,20,1.1*Math.PI,1.9*Math.PI);g.stroke();}); tears(); g.lineWidth=12; g.beginPath(); g.arc(160,150,46,0.15*Math.PI,0.85*Math.PI); g.stroke(); break;
      case 'joy': g.lineWidth=11; ex.forEach(x=>{g.beginPath();g.arc(x,ey+8,20,1.1*Math.PI,1.9*Math.PI);g.stroke();});
        g.beginPath(); g.moveTo(110,150); g.lineTo(210,150); g.arc(160,150,50,0,Math.PI); g.closePath(); g.fill();
        g.fillStyle='#e85a6a'; g.beginPath(); g.arc(160,185,22,0,Math.PI*2); g.fill(); break;
      case 'shock': ex.forEach(x=>{g.fillStyle='#fff';g.beginPath();g.arc(x,ey,24,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(x,ey,11,0,7);g.fill();});
        g.beginPath(); g.ellipse(160,185,20,26,0,0,7); g.fill(); break;
      case 'mean': eyes(12,14); brows(18,-6); g.beginPath(); g.moveTo(115,165); g.quadraticCurveTo(170,200,215,150); g.stroke();
        g.beginPath(); g.moveTo(125,168); g.quadraticCurveTo(170,215,210,158); g.closePath(); g.fill(); break;
      case 'old': eyes(10,16);
        g.lineWidth=7; ex.forEach(x=>{g.beginPath();g.arc(x,ey,30,0,7);g.stroke();}); g.beginPath();g.moveTo(140,ey);g.lineTo(180,ey);g.stroke();
        g.fillStyle='#ddd'; g.beginPath(); g.ellipse(160,158,52,14,0,0,7); g.fill(); g.fillStyle='#111';
        g.lineWidth=10; g.beginPath(); g.arc(160,165,34,0.2*Math.PI,0.8*Math.PI); g.stroke(); break;
      case 'oldsad': eyes(10,16);
        g.lineWidth=7; ex.forEach(x=>{g.beginPath();g.arc(x,ey,30,0,7);g.stroke();}); g.beginPath();g.moveTo(140,ey);g.lineTo(180,ey);g.stroke();
        g.fillStyle='#ddd'; g.beginPath(); g.ellipse(160,158,52,14,0,0,7); g.fill(); g.fillStyle='#111';
        g.lineWidth=9; g.beginPath(); g.arc(160,175,20,0.15*Math.PI,0.85*Math.PI); g.stroke(); break;
      case 'down': eyes(12,8); brows(-10,8); g.beginPath(); g.arc(160,215,36,1.25*Math.PI,1.75*Math.PI); g.stroke(); break;
    }
  });
  return faceCache[type]=t;
}
function jerseyTex(color, number, name, hoop){
  return ctex(256,256,(g,w,h)=>{
    g.fillStyle=color; g.fillRect(0,0,w,h);
    if(hoop){ g.fillStyle=hoop; g.fillRect(0,40,w,28); g.fillRect(0,130,w,28); }
    if(number!==undefined){
      g.fillStyle='#fff'; g.font='900 150px Inter'; g.textAlign='center'; g.textBaseline='middle';
      g.lineWidth=10; g.strokeStyle='rgba(0,0,0,.35)'; g.strokeText(number,128,150); g.fillText(number,128,150);
      if(name){ g.font='900 40px Inter'; g.fillText(name,128,40); }
    }
  });
}

// ---------- avatar ----------
const geoBox = new THREE.BoxGeometry(1,1,1);
function part(w,h,d,mat,y){ const m=new THREE.Mesh(geoBox,mat); m.scale.set(w,h,d); m.position.y=y; m.castShadow=true; m.receiveShadow=true; return m; }
const avatars=[];
function makeAvatar(o){
  const skin=M(o.skin||'#f5c9a0'), shirt=M(o.shirt), shorts=M(o.shorts||'#ffffff'), socks=M(o.socks||o.shirt), boots=M('#111');
  const root=new THREE.Group(); const body=new THREE.Group(); root.add(body);
  // legs
  const legs=[-0.5,0.5].map(x=>{ const p=new THREE.Group(); p.position.set(x,2,0);
    p.add(part(.98,.8,1,shorts,-.4)); p.add(part(.96,.55,.96,skin,-1.07));
    if(o.trousers){ p.children[1].material=shorts; }
    p.add(part(.98,.5,.98,socks,-1.6)); p.add(part(1,.2,1.15,boots,-1.9));
    body.add(p); return p; });
  // torso
  const front = o.frontTex ? new THREE.MeshStandardMaterial({map:o.frontTex,roughness:.8}) : shirt;
  const back = o.backTex ? new THREE.MeshStandardMaterial({map:o.backTex,roughness:.8}) : shirt;
  const torso=new THREE.Mesh(geoBox,[shirt,shirt,shirt,shirt,front,back]); torso.scale.set(2,2,1); torso.position.y=3; torso.castShadow=true;
  const torsoG=new THREE.Group(); torsoG.position.y=2; torso.position.y=1; torsoG.add(torso); body.add(torsoG);
  const arms=[-1.5,1.5].map(x=>{ const p=new THREE.Group(); p.position.set(x,1.8,0);
    p.add(part(.98,.75,.98,shirt,-.2)); p.add(part(.96,1.25,.96,o.longSleeve?shirt:skin,-1.2)); p.children[1].position.y=-1.15;
    if(o.longSleeve){ const hnd=part(.97,.3,.97,skin,-1.65); p.add(hnd); }
    torsoG.add(p); return p; });
  // head
  const head=new THREE.Group(); head.position.y=2; torsoG.add(head);
  const hm=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,1.2,32), skin); hm.position.y=.62; hm.castShadow=true; head.add(hm);
  const faceMat=new THREE.MeshBasicMaterial({map:faceTex(o.face||'smile'), transparent:true, depthWrite:false});
  const fm=new THREE.Mesh(new THREE.CylinderGeometry(.625,.625,1.0,32,1,true,-1.05,2.1), faceMat); fm.position.y=.62; head.add(fm);
  if(o.hair){ const hmat=M(o.hair);
    const top=new THREE.Mesh(new THREE.CylinderGeometry(.66,.66,.35,32),hmat); top.position.y=1.28; top.castShadow=true; head.add(top);
    const bk=new THREE.Mesh(new THREE.CylinderGeometry(.66,.66,.7,32,1,false,Math.PI*0.55,Math.PI*0.9),hmat); bk.position.y=1.0; head.add(bk);
    if(o.bald){ top.visible=false; bk.position.y=.85; bk.scale.y=.6; }
  }
  root.scale.setScalar(o.scale||1);
  const av={root,body,torso:torsoG,head,lLeg:legs[0],rLeg:legs[1],lArm:arms[0],rArm:arms[1],faceMat,
    setFace(f){ this.faceMat.map=faceTex(f); },
    reset(){ for(const p of [this.lLeg,this.rLeg,this.lArm,this.rArm,this.head,this.torso]) p.rotation.set(0,0,0); this.body.position.set(0,0,0); this.root.visible=true; }};
  avatars.push(av); return av;
}
function poseRun(av, ph, amp=1){ const s=Math.sin(ph);
  av.lLeg.rotation.x= s*0.9*amp; av.rLeg.rotation.x=-s*0.9*amp;
  av.lArm.rotation.x=-s*0.9*amp; av.rArm.rotation.x= s*0.9*amp;
  av.torso.rotation.x=0.18*amp; av.body.position.y=Math.abs(Math.cos(ph))*0.35*amp; }
function poseWalk(av, ph, amp=1){ const s=Math.sin(ph);
  av.lLeg.rotation.x= s*0.5*amp; av.rLeg.rotation.x=-s*0.5*amp; av.lArm.rotation.x=-s*0.4*amp; av.rArm.rotation.x=s*0.4*amp; av.body.position.y=Math.abs(Math.cos(ph))*0.1; }
function poseBreath(av,t){ av.torso.rotation.x=Math.sin(t*2)*0.02; av.lArm.rotation.z=-0.06-Math.sin(t*2)*0.02; av.rArm.rotation.z=0.06+Math.sin(t*2)*0.02; }
function place(av,p,ry){ av.root.position.copy(p); av.root.rotation.y=ry; }
function faceDir(from,to){ return Math.atan2(to.x-from.x, to.z-from.z); }

// ---------- ball ----------
const ballTex = ctex(256,128,(g,w,h)=>{ g.fillStyle='#f4efe4'; g.fillRect(0,0,w,h); g.fillStyle='#1d4ed8'; g.fillRect(0,46,w,36);
  g.fillStyle='#c81e1e'; g.fillRect(0,40,w,6); g.fillRect(0,82,w,6); g.strokeStyle='#999'; g.lineWidth=3; for(let i=0;i<4;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.stroke();} });
function makeBall(){ const m=new THREE.Mesh(new THREE.SphereGeometry(1,32,20), new THREE.MeshStandardMaterial({map:ballTex,roughness:.6}));
  m.scale.set(.55,.55,.9); m.castShadow=true; const g=new THREE.Group(); m.rotation.x=0; g.add(m); g.userData.m=m; scene.add(g); return g; }
const ball = makeBall();

// ---------- world groups ----------
const G = {stadium:new THREE.Group(), garden:new THREE.Group(), school:new THREE.Group(), cemetery:new THREE.Group()};
Object.values(G).forEach(g=>scene.add(g));

// ===== STADIUM =====
const grassTex = ctex(512,512,(g,w,h)=>{ for(let i=0;i<8;i++){ g.fillStyle=i%2?'#2f7d32':'#38903a'; g.fillRect(0,i*64,w,64);}
  for(let i=0;i<3000;i++){ g.fillStyle=`rgba(${rnd()*40|0},${80+rnd()*60|0},20,.25)`; g.fillRect(rnd()*w,rnd()*h,2,4);} });
grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping; grassTex.repeat.set(4,4);
const field=new THREE.Mesh(new THREE.PlaneGeometry(420,420), new THREE.MeshStandardMaterial({map:grassTex,roughness:.95}));
field.rotation.x=-Math.PI/2; field.position.set(0,0,60); field.receiveShadow=true; G.stadium.add(field);
const lineM=M('#ffffff',{roughness:.6});
const line=(x,z,w,d)=>{ const m=box(w,.06,d,lineM,false); m.position.set(x,.03,z); G.stadium.add(m); };
line(0,0,190,.5); line(0,62,190,.5); line(0,-28,190,.5); line(95,60,.5,200); line(-95,60,.5,200);
for(let x=-90;x<=90;x+=6) line(x,15,2.4,.4);
// posts
const postM=M('#ffffff',{roughness:.35});
const padM=M('#1d4ed8');
[-8,8].forEach(x=>{ const p=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,34,16),postM); p.position.set(x,17,0); p.castShadow=true; G.stadium.add(p);
  const pad=box(1.8,5,1.8,padM); pad.position.set(x,2.5,0); G.stadium.add(pad); });
const bar=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,16,16),postM); bar.rotation.z=Math.PI/2; bar.position.set(0,8,0); bar.castShadow=true; G.stadium.add(bar);
// tee
const tee=new THREE.Mesh(new THREE.CylinderGeometry(.15,.45,.5,12), M('#ff8a00'));
const T=V(40,0,60); tee.position.set(T.x,.25,T.z); G.stadium.add(tee);
// stands + crowd
const standM=M('#2a2f3a',{roughness:.9}); const standM2=M('#3a4150',{roughness:.9});
const crowdSpots=[]; // {pos, ry}
function stand(kind){
  for(let r=0;r<13;r++){
    const top=1.5+r*2.0, off=r*3.2;
    let m;
    if(kind==='back'){ m=box(230,top,3.2,r%2?standM:standM2,false); m.position.set(0,top/2,-40-off-1.6); }
    else { const sx=kind==='right'?1:-1; m=box(3.2,top,190,r%2?standM:standM2,false); m.position.set(sx*(108+off+1.6),top/2,55); }
    G.stadium.add(m);
    if(kind==='back'){ for(let x=-112;x<=112;x+=2.3) if(rnd()<.9) crowdSpots.push({p:V(x+rnd()*.4,top,-40-off-1.6),ry:0}); }
    else { const sx=kind==='right'?1:-1; for(let z=-38;z<=148;z+=2.3) if(rnd()<.9) crowdSpots.push({p:V(sx*(108+off+1.6),top,z+rnd()*.4),ry:sx>0?-Math.PI/2:Math.PI/2}); }
  }
}
stand('back'); stand('left'); stand('right');
// keep a hole for papi in right stand row 0 near z=30
const papiSeat=V(109.6,1.5,30);
const spots=crowdSpots.filter(s=>s.p.distanceTo(papiSeat)>2.6);
const N=spots.length;
const cBody=new THREE.InstancedMesh(new THREE.BoxGeometry(1.7,2.4,1), new THREE.MeshStandardMaterial({roughness:.8}), N);
const cHead=new THREE.InstancedMesh(new THREE.BoxGeometry(1.05,1.05,1.05), new THREE.MeshStandardMaterial({roughness:.8}), N);
const cArms=new THREE.InstancedMesh(new THREE.BoxGeometry(2.4,.45,.45), new THREE.MeshStandardMaterial({roughness:.8}), N);
const pal=['#1d4ed8','#1d4ed8','#2563eb','#c81e1e','#dc2626','#ffffff','#facc15','#111827','#16a34a','#f97316'];
const skins=['#f5c9a0','#e0a878','#a56a43','#6b4226','#f1d2b6'];
const phase=new Float32Array(N), cheer=new Float32Array(N);
for(let i=0;i<N;i++){ const c=new THREE.Color(pal[(rnd()*pal.length)|0]); cBody.setColorAt(i,c); cArms.setColorAt(i,c); cHead.setColorAt(i,new THREE.Color(skins[(rnd()*skins.length)|0])); phase[i]=rnd()*6.28; cheer[i]=.6+rnd()*.8; }
G.stadium.add(cBody,cHead,cArms);
const dummy=new THREE.Object3D();
function updateCrowd(t, mode){
  for(let i=0;i<N;i++){ const s=spots[i]; let jy=0, arm=0;
    if(mode==='party'){ jy=Math.abs(Math.sin(t*9*cheer[i]+phase[i]))*1.4; arm=1; }
    else if(mode==='tense'){ jy=0; }
    else { jy=Math.max(0,Math.sin(t*1.5+phase[i]))*0.08; }
    dummy.position.set(s.p.x, s.p.y+1.2+jy, s.p.z); dummy.rotation.set(0,s.ry,0); dummy.scale.set(1,1,1); dummy.updateMatrix(); cBody.setMatrixAt(i,dummy.matrix);
    dummy.position.y=s.p.y+2.95+jy; dummy.updateMatrix(); cHead.setMatrixAt(i,dummy.matrix);
    if(arm){ dummy.position.y=s.p.y+3.4+jy+Math.sin(t*12+phase[i])*.3; dummy.scale.set(1.1,1,1);} else { dummy.position.y=s.p.y+1.6; dummy.scale.set(.9,1,1);} dummy.updateMatrix(); cArms.setMatrixAt(i,dummy.matrix);
  }
  cBody.instanceMatrix.needsUpdate=cHead.instanceMatrix.needsUpdate=cArms.instanceMatrix.needsUpdate=true;

  mates.forEach((m,i)=>{ m.reset(); const p=T.clone().addScaledVector(D,-24-(i%3)*2.5).addScaledVector(P,-9+i*3.6); place(m,p,ryK); m.setFace('nervous'); poseBreath(m,t+i);
    m.lArm.rotation.x=-.5; m.rArm.rotation.x=-.5; m.lArm.rotation.z=.5; m.rArm.rotation.z=-.5; });
  // reds behind try line
  reds.forEach((r,i)=>{ r.reset(); const p=V(-10+i*4,0,-4); place(r,p,faceDir(p,T)); r.setFace('determined'); poseBreath(r,t*1.3+i); r.torso.rotation.x=.15; });
  judges.forEach((j,i)=>{ j.reset(); place(j,V(i?6:-6,0,-12),0); j.rArm.rotation.x=0; });
  kid.root.visible=false; papi.root.visible=false; bullies.forEach(b=>b.root.visible=false);
  bird.visible=false; ball.visible=true;
  shadowAt(V(20,0,30));
}
function hideAll(){ avatars.forEach(a=>a.root.visible=false); }

function renderAt(t){
  const sc=TL.find(s=>t>=s[1]&&t<s[2])||TL[TL.length-1]; const [name,a,b]=sc; const u=(t-a)/(b-a); const lt=t-a;
  ball.userData.m.rotation.set(0,0,0); ball.rotation.set(0,0,0); ball.scale.setScalar(name==='fb1'||name==='fb2'?.75:1); ball.visible=true; rain.visible=false;
  avatars.forEach(a=>a.reset());
  if(name==='hook'||name==='place'||name==='face'||name.startsWith('step')||name==='kick'){
    setupPresent(t, name==='hook'||name==='place'?'idle':'tense');
    enzo.reset(); enzo.setFace(name==='face'?'nervous':'determined');
    if(name==='hook'){ place(enzo,T.clone().addScaledVector(D,-2.5),ryK); poseBreath(enzo,t); enzo.lArm.rotation.x=enzo.rArm.rotation.x=-1.2; enzo.lArm.rotation.z=.35; enzo.rArm.rotation.z=-.35;
      const hp=enzo.root.position.clone().addScaledVector(D,1.4); hp.y=2.9; ball.position.copy(hp); ball.rotation.y=ryK;
      const e=ease(u); cam(vl(T.clone().addScaledVector(D,-55).add(V(0,34,0)), T.clone().addScaledVector(D,-14).add(V(-6,7,0)), e), vl(V(0,10,0),V(6,6,10),e), 50); }
    if(name==='place'){
      const crouch=Math.sin(Math.PI*seg(u,0,.45));
      const back=ease(seg(u,.45,1));
      const p=vl(T.clone().addScaledVector(D,-2.2), S, back); place(enzo,p,ryK);
      enzo.torso.rotation.x=crouch*0.9; enzo.body.position.y=-crouch*0.7; enzo.lLeg.rotation.x=enzo.rLeg.rotation.x=-crouch*0.5;
      enzo.lArm.rotation.x=enzo.rArm.rotation.x=-0.9-crouch*0.6;
      if(u<.32){ const hp=enzo.root.position.clone().addScaledVector(D,1.6); hp.y=lerp(2.9,1.0,seg(u,.05,.32)); ball.position.copy(hp); }
      else ball.position.copy(ballOnTee);
      ball.rotation.y=ryK; ball.rotation.x=-0.25;
      if(u>.45){ enzo.lArm.rotation.x=enzo.rArm.rotation.x=0; poseWalk(enzo, lt*7, .6*(1-seg(u,.92,1))); enzo.lLeg.rotation.x*=-1; enzo.rLeg.rotation.x*=-1; }
      const side=T.clone().addScaledVector(P,14).addScaledVector(D,2).add(V(0,3.2,0));
      cam(vl(side, side.clone().addScaledVector(P,-3).add(V(0,1,0)), ease(u)), vl(T.clone().addScaledVector(D,-1).add(V(0,2.2,0)), T.clone().addScaledVector(D,-6).add(V(0,3,0)), ease(u)), 48); }
    if(name==='face'){ place(enzo,S,ryK); poseBreath(enzo,t*2); ball.position.copy(ballOnTee); ball.rotation.y=ryK; ball.rotation.x=-.25;
      enzo.head.rotation.x=Math.sin(t*1.2)*0.02;
      const hp=S.clone().add(V(0,4.7,0)); const cp=hp.clone().addScaledVector(D,lerp(4.2,3.0,u)).add(V(0,.1,0)).addScaledVector(P,.6);
      cam(cp,hp,40,0.01,t); }
    if(name.startsWith('step')){ const k=+name[4]; const f0=(k-1)/4*.8, f1=f0+.2*0.5; const f=lerp(f0,f1,u); place(enzo,vl(S,K,f),ryK);
      poseRun(enzo, (k*Math.PI)+u*Math.PI*.6, .9); ball.position.copy(ballOnTee); ball.rotation.y=ryK; ball.rotation.x=-.25;
      const ep=enzo.root.position.clone();
      if(k===1) cam(ep.clone().addScaledVector(D,-6).addScaledVector(P,2.5).add(V(0,1.2,0)), ep.clone().addScaledVector(D,4).add(V(0,1,0)), 55); // low behind feet
      if(k===2) cam(ep.clone().addScaledVector(P,13).addScaledVector(D,2).add(V(0,4.5,0)), ep.clone().add(V(0,3.2,0)), 40);
      if(k===3) cam(ep.clone().addScaledVector(D,3.2).add(V(0,4.8,0)), ep.clone().add(V(0,4.6,0)), 42);
      if(k===4) cam(T.clone().addScaledVector(D,6).addScaledVector(P,-1.5).add(V(0,1.2,0)), ep.clone().add(V(0,3,0)), 45);
      enzo.setFace(k===3?'nervous':'determined'); }
    if(name==='kick'){
      const kc=.22; // contact
      const fr=lerp(.8,1,seg(u,0,kc)); place(enzo,vl(S,K,fr),ryK);
      if(u<kc){ poseRun(enzo, u/kc*Math.PI*1.4, 1); }
      else { const k2=seg(u,kc,kc+.2); enzo.rLeg.rotation.x=lerp(-1.6,-.9,k2); enzo.lLeg.rotation.x=.1; enzo.lArm.rotation.z=1.2; enzo.rArm.rotation.x=.6; enzo.torso.rotation.x=-.15; enzo.lArm.rotation.x=-.3; }
      if(u<kc){ enzo.rLeg.rotation.x=lerp(.9,-1.6,seg(u,kc-.08,kc)); ball.position.copy(ballOnTee); ball.rotation.y=ryK; ball.rotation.x=-.25; }
      else { const s=seg(u,kc,1); ball.position.copy(ballFlight(s)); ball.rotation.y=ryK; ball.userData.m.rotation.x=-s*28; }
      enzo.head.rotation.x = u>kc? -0.35*seg(u,kc,.6):0;
      if(u<kc+.06){ const ep=enzo.root.position.clone(); cam(ep.clone().addScaledVector(D,-5).addScaledVector(P,2.2).add(V(0,2.2,0)), T.clone().add(V(0,1,0)), 48, u>kc&&u<kc+.05?.12:0, t); }
      else { const s=seg(u,kc,1); const bp=ball.position.clone(); const cp=bp.clone().addScaledVector(D,-lerp(9,7,s)).addScaledVector(P,lerp(3,4,s)).add(V(0,lerp(1.5,0.6,s),0)); cam(cp,bp.clone().addScaledVector(D,3),46); }
      updateCrowd(t,'tense');
    }
  }
  else if(name==='hit'||name==='pass'){
    setupPresent(t,'tense'); place(enzo,K,ryK); enzo.setFace(name==='hit'?'shock':'shock'); enzo.lArm.rotation.x=enzo.rArm.rotation.x=-.4; enzo.head.rotation.x=-.3;
    if(name==='hit'){ const s=u<.12? 0 : seg(u,.12,1)*.08; ball.position.copy(ballDeflect(s)); ball.userData.m.rotation.x=-28-s*3; ball.rotation.y=ryK;
      const shake=u<.25?.35*(1-u/.25):0;
      cam(V(14,15.5,9), V(7.2,14,0), 34+u*-6, shake, t); }
    else { const s=lerp(.08,1,ease(clamp(u*1.15))); ball.position.copy(ballDeflect(s)); ball.userData.m.rotation.x=-31-s*10; ball.rotation.y=ryK+s*.8;
      // judges raise flags
      const fl=seg(u,.32,.45); judges.forEach(j=>{ j.rArm.rotation.x=lerp(0,-Math.PI,fl); j.rArm.rotation.z=0; });
      if(u<.5) cam(V(-3,2.5,-36), V(2,11,-2), 52); else { const e=ease(seg(u,.5,1)); cam(vl(V(-3,2.5,-36),V(6,6,-26),e), vl(V(2,9,-2),V(0,8,0),e), 52); }
      if(u>.33){ updateCrowd(t,'party'); }
      if(u>.4){ enzo.setFace('joy'); }
    }
  }
  else if(name==='celebrate'){
    setupPresent(t,'party'); updateConfetti(lt+.2, K);
    const ep=K.clone(); place(enzo,ep,ryK+Math.PI*0.9); enzo.setFace('joy');
    const j=Math.abs(Math.sin(lt*5)); enzo.body.position.y=j*1.4; enzo.lArm.rotation.x=enzo.rArm.rotation.x=-Math.PI+.2*Math.sin(lt*10); enzo.lArm.rotation.z=.25; enzo.rArm.rotation.z=-.25;
    mates.forEach((m,i)=>{ const start=T.clone().addScaledVector(D,-24-(i%3)*2.5).addScaledVector(P,-9+i*3.6); const ang=i/6*Math.PI*2; const goal=ep.clone().add(V(Math.cos(ang)*5,0,Math.sin(ang)*5));
      const r=ease(seg(u,0,.45)); const p=vl(start,goal,r); place(m,p,faceDir(p,ep)); m.setFace('joy');
      if(r<1) poseRun(m,lt*12+i,1); else { m.body.position.y=Math.abs(Math.sin(lt*6+i))*1.2; m.lArm.rotation.x=m.rArm.rotation.x=-Math.PI+.3; } });
    reds.forEach((r,i)=>{ r.setFace('down'); r.body.position.y=-1.1; r.lLeg.rotation.x=1.3; r.rLeg.rotation.x=-0.2; r.torso.rotation.x=.4; r.head.rotation.x=.5; r.lArm.rotation.x=r.rArm.rotation.x=-.3; });
    judges.forEach(j=>{ j.rArm.rotation.x=-Math.PI; });
    const ang=lt*.55+1.2; cam(ep.clone().add(V(Math.cos(ang)*24,9+Math.sin(lt)*.5,Math.sin(ang)*24)), ep.clone().add(V(0,3.5,0)), 46);
    ball.visible=false;
  }
  else if(name==='sky'){
    setupPresent(t,'party'); updateConfetti(lt+4.2, K); ball.visible=false;
    const ep=K.clone(); place(enzo,ep,ryK+Math.PI*0.9); enzo.setFace('happycry');
    mates.forEach((m,i)=>{ const ang=i/6*Math.PI*2+ (enzo.root.rotation.y); place(m,ep.clone().add(V(-Math.sin(ang+Math.PI/2)*6,0,-Math.cos(ang+Math.PI/2)*6)),0); if(i===1||i===2) m.root.visible=false; m.root.rotation.y=faceDir(m.root.position,ep); m.setFace('joy'); m.lArm.rotation.x=m.rArm.rotation.x=-Math.PI+.3; m.body.position.y=Math.abs(Math.sin(t*6+i))*1.0; });
    reds.forEach(r=>{ r.root.visible=false; });
    enzo.head.rotation.x=-0.75*ease(seg(u,0,.25)); enzo.torso.rotation.x=-.12; enzo.rArm.rotation.x=-Math.PI*ease(seg(u,.12,.3)); enzo.rArm.rotation.z=-.15;
    const fwd=V(Math.sin(enzo.root.rotation.y),0,Math.cos(enzo.root.rotation.y));
    if(u<.42){ const hp=ep.clone().add(V(0,4.7,0)); cam(hp.clone().addScaledVector(fwd,6.5).add(V(0,-1.6,0)), hp.clone().add(V(0,.6,0)), 46); }
    else { const s=seg(u,.42,1); const eye=ep.clone().add(V(0,7.2,0)).addScaledVector(fwd,2.5); const dir=moon.position.clone().sub(eye).normalize();
      cam(eye, eye.clone().addScaledVector(dir,100).add(V(0,-12+s*6,0)), lerp(55,48,s));
      bird.visible=true; const right=new THREE.Vector3().crossVectors(dir,V(0,1,0)).normalize(); const center=eye.clone().addScaledVector(dir,80);
      bird.position.copy(center).addScaledVector(right,lerp(-45,45,s)).add(V(0,lerp(-14,-2,s),0)); bird.lookAt(bird.position.clone().add(right)); bird.rotateY(-Math.PI/2);
      bird.lookAt(bird.position.clone().addScaledVector(right,1)); const fl=Math.sin(t*14)*.7; wLg.rotation.z=fl; wRg.rotation.z=-fl; }
  }
  else if(name==='fb1'){
    hideAll(); env('garden'); shadowAt(V(0,0,0));
    kid.root.visible=papi.root.visible=true; ball.visible=true;
    const pp=V(2.4,0,0), kp=V(-2.2,0,0.4); place(papi,pp,faceDir(pp,kp)); place(kid,kp,faceDir(kp,pp));
    papi.setFace('old'); papi.body.position.y=-.9; papi.lLeg.rotation.x=-1.1; papi.rLeg.rotation.x=.4; papi.torso.rotation.x=.35;
    const give=ease(seg(u,.12,.45));
    papi.lArm.rotation.x=papi.rArm.rotation.x=lerp(-1.3,-1.6,give)+ (u>.5? .9*seg(u,.5,.6):0); papi.lArm.rotation.z=.25; papi.rArm.rotation.z=-.25;
    const handP=pp.clone().add(faceDirVec(papi).multiplyScalar(lerp(2.2,3.3,give))).add(V(0,2.3,0));
    if(u<.5){ ball.position.copy(handP); } else { const kb=kp.clone().add(faceDirVec(kid).multiplyScalar(1.1)); kb.y=2.2*.68+.6; ball.position.copy(kb); }
    ball.rotation.y=Math.PI/2;
    kid.setFace(u<.45?'shock':'joy'); kid.lArm.rotation.x=kid.rArm.rotation.x=u<.45? -0.9*give : -1.5; kid.lArm.rotation.z=.3; kid.rArm.rotation.z=-.3;
    if(u>.55){ const j=Math.abs(Math.sin((u-.55)*16)); kid.root.position.y=j*1.2; ball.position.y+=j*1.2; papi.setFace('old'); }
    const e=ease(u); cam(vl(V(0,5.5,22),V(-.5,4.2,16),e), V(0,2.6,0), 44);
  }
  else if(name==='fb2'){
    hideAll(); env('school'); shadowAt(V(0,0,0));
    kid.root.visible=true; bullies.forEach(b=>b.root.visible=true);
    const kp=V(0,0,0); place(kid,kp,0); kid.setFace(u<.4?'sad':'cry'); kid.head.rotation.x=u>.5?.25:0;
    const bp=[V(-4.2,0,-2),V(4.4,0,-1.5),V(-1,0,-5)];
    bullies.forEach((b,i)=>{ place(b,bp[i],faceDir(bp[i],kp)); b.setFace('mean'); const L=Math.abs(Math.sin(lt*9+i)); b.body.position.y=L*.35; b.torso.rotation.x=-.1-.1*L;
      b.rArm.rotation.x=-1.5; b.lArm.rotation.x=-.2; b.lArm.rotation.z=.6*L; });
    // ball dropping
    if(u<.55){ ball.position.set(0,1.5,.9); ball.rotation.y=Math.PI/2; kid.lArm.rotation.x=kid.rArm.rotation.x=-.8; }
    else { const s=seg(u,.55,1); const y=Math.max(.5, 1.5-9*s*s*4); ball.position.set(s*3.5,y+Math.abs(Math.sin(s*9))*.4*(1-s),.9+s*2); ball.userData.m.rotation.x=s*8; kid.lArm.rotation.x=kid.rArm.rotation.x=0; }
    if(u<.5){ const e=ease(seg(u,0,.5)); cam(vl(V(0,9,13),V(0,6,10),e), V(0,1.6,-1.5), 50); }
    else { const e=ease(seg(u,.5,1)); const hp=V(0,4.7*.68,0); cam(vl(V(.6,3.6,4),V(.4,3.3,2.6),e), hp, 42); }
  }
  else if(name==='fb3'){
    hideAll(); env('day'); updateCrowd(t,'idle'); shadowAt(V(100,0,30));
    papi.root.visible=true; papi.reset(); place(papi,V(papiSeat.x,papiSeat.y,papiSeat.z),-Math.PI/2); papi.setFace(u<.6?'old':'oldsad');
    const w=Math.sin(lt*6); papi.rArm.rotation.z=-(2.5+.35*w); papi.lArm.rotation.x=-.3;
    if(u>.62){ papi.rArm.rotation.z=-.1; papi.rArm.rotation.x=-1.4; papi.torso.rotation.x=.25+Math.abs(Math.sin(lt*10))*.12; papi.head.rotation.x=.2; } // coughing
    const teen=enzo; teen.root.visible=true; teen.reset(); const tp=V(98,0,31); place(teen,tp,Math.PI/2); teen.setFace(u<.62?'smile':'sad');

    if(u<.5){ const e=ease(seg(u,0,.5)); cam(vl(V(92,4.6,26),V(94,4.8,27.5),e), V(papiSeat.x,papiSeat.y+3.8,papiSeat.z), 38); }
    else { const e=ease(seg(u,.5,1)); const hp=V(papiSeat.x,papiSeat.y+4.6,papiSeat.z); cam(vl(V(100.5,5.4,31.5),V(101.8,5.3,31),e), hp, 38); }
  }
  else if(name==='fb4'){
    hideAll(); env('cemetery'); shadowAt(V(0,0,0)); rain.visible=true; updateRain(t);
    enzo.root.visible=true; enzo.reset(); const ep=V(0,0,2.6); place(enzo,ep,Math.PI); enzo.setFace('cry');
    enzo.body.position.y=-1.25; enzo.lLeg.rotation.x=enzo.rLeg.rotation.x=1.35; enzo.torso.rotation.x=.25; enzo.head.rotation.x=.35;
    const put=ease(seg(u,.15,.5)); enzo.rArm.rotation.x=lerp(-.3,-1.2,put); enzo.lArm.rotation.x=lerp(-.3,-1.2,put); enzo.lArm.rotation.z=.2; enzo.rArm.rotation.z=-.2;
    if(u<.5){ ball.position.set(0,lerp(2.2,1.6,put),lerp(1.3,.5,put)); } else ball.position.set(0,1.05,.4);
    ball.rotation.y=Math.PI/2;
    if(u>.55){ enzo.head.rotation.x=lerp(.35,-.05,ease(seg(u,.55,.75))); }
    if(u<.5){ const e=ease(seg(u,0,.5)); cam(vl(V(9,7,12),V(6,5,9),e), V(0,2.4,0), 46); }
    else { const e=ease(seg(u,.5,1)); cam(vl(V(4.2,3.9,-2.6),V(3.4,3.7,-1.8),e), V(0,3.2,2.6), 42); }
  }
  overlay(t,name,u);
  renderer.render(scene,camera);
}
function faceDirVec(av){ return V(Math.sin(av.root.rotation.y),0,Math.cos(av.root.rotation.y)); }
window.renderAt=renderAt; window.DUR=DUR;
document.fonts.ready.then(()=>{ renderAt(0); window.READY=true; });
